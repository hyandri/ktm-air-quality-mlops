[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hawa"
version = "0.1.0"
description = "Hawa: Kathmandu PM2.5 forecasting with an MLOps pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "requests",
    "scikit-learn",
    "lightgbm",
    "mlflow",
    "sqlalchemy",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]   # httpx: FastAPI test client
pipeline = ["dvc"]   # not in CI (heavy): pip install -e ".[pipeline]"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
