[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hawa"
version = "0.1.0"
description = "Hawa: Kathmandu PM2.5 forecasting with an MLOps pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
