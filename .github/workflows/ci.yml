name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Command line tools start
        run: |
          python -m hawa.models.train --help
          python -m hawa.evaluation.walk_forward --help
          python -m hawa.evaluation.final_test --help
          python -m hawa.processing.features --help
          python -m hawa.forecasting.batch --help
          python -m hawa.forecasting.actuals --help
          python -m hawa.db.init --help
